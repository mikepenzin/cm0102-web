<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CM 01/02 admin</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181d; --raised: #1b2027; --hover: #222a33; --line: #262c34; --line2: #333c47; --text: #e7eaee; --muted: #8b95a2;
    --accent: #3ccf7f; --accent-dim: rgba(60, 207, 127, .14); --warn: #e5a43a; --warn-dim: rgba(229, 164, 58, .12); --bad: #ef6b6b; --bad-dim: rgba(239, 107, 107, .12);
    --bar: #3ccf7f; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  button, input, select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 34px; }
  button { cursor: pointer; transition: border-color 150ms, background-color 150ms; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--line2); background-color: var(--hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.small { min-height: 28px; padding: 2px 10px; font-size: 12px; }
  input:focus, select:focus { border-color: var(--accent); outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .bad { color: var(--bad); } .good { color: var(--accent); } .warn { color: var(--warn); }
  .spacer { flex: 1; }
  code { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }

  /* The header: the title, the time of the data and Refresh; the tabs under it. */
  header { position: sticky; top: 0; z-index: 5; background: rgba(11, 13, 16, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px 0; max-width: 1280px; margin: 0 auto; }
  .bar h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  #at { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav.tabs { display: flex; gap: 2px; padding: 6px 14px 0; max-width: 1280px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { color: var(--muted); text-decoration: none; padding: 8px 10px 9px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
  .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--raised); color: var(--muted); font-size: 11px;
    text-align: center; font-variant-numeric: tabular-nums; line-height: 18px; }
  .count.alert { background: var(--bad-dim); color: var(--bad); }
  .count:empty { display: none; }

  main { padding: 18px 20px 48px; max-width: 1280px; margin: 0 auto; }
  .view { display: none; }
  body[data-tab="overview"] #view-overview, body[data-tab="people"] #view-people, body[data-tab="errors"] #view-errors, body[data-tab="library"] #view-library, body[data-tab="members"] #view-members, body[data-tab="early"] #view-early { display: block; }
  body.gated .view, body.gated nav.tabs { display: none; }
  .msg { padding: 48px 0; text-align: center; color: var(--muted); }
  #oops { display: none; margin-bottom: 14px; padding: 8px 12px; border-radius: 8px; background: var(--warn-dim); color: var(--warn); font-size: 13px; }
  #oops.on { display: block; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel h2 .spacer + * { text-transform: none; letter-spacing: 0; }

  /* Overview: what to look at, the totals, the days. */
  .attention { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .attention .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
  .attention .item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .attention .item.t-bad .dot { background: var(--bad); } .attention .item.t-warn .dot { background: var(--warn); } .attention .item.t-good .dot { background: var(--accent); }
  .attention .item .what { flex: 1; min-width: 0; }
  .attention .item .what b { font-weight: 600; }
  .attention .item .what .small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .card .sub { color: var(--muted); font-size: 12px; }
  a.card { color: inherit; text-decoration: none; } a.card:hover { border-color: var(--line2); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; min-height: 30px; padding: 3px 11px; background: transparent; color: var(--muted); font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .chart { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; min-width: 0; }
  .chart .title { font-size: 12px; color: var(--muted); }
  .chart .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .chart .readout { font-size: 12px; color: var(--muted); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart .readout.live { color: var(--text); }
  .plot { position: relative; height: 96px; margin-top: 10px; border-bottom: 1px solid var(--line2); display: flex; align-items: flex-end; gap: 2px; touch-action: pan-y; cursor: crosshair; }
  .plot.dense { gap: 1px; }
  .plot .grid { position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed var(--line); pointer-events: none; }
  .plot .grid span { position: absolute; right: 0; top: -15px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .plot i { flex: 1; min-width: 0; background: var(--bar); opacity: .8; border-radius: 3px 3px 0 0; pointer-events: none; }
  .plot.dense i { border-radius: 1px 1px 0 0; }
  .plot.hovering i { opacity: .35; } .plot.hovering i.on { opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
  .delta { font-size: 12px; } .delta.up-good, .delta.down-good { color: var(--accent); } .delta.up-bad, .delta.down-bad { color: var(--bad); } .delta.flat { color: var(--muted); }

  /* The lists: tools above, a table on a wide screen, cards on a phone. */
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tools input[type="search"] { flex: 1 1 260px; min-width: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border-radius: 16px; min-height: 30px; padding: 3px 12px; font-size: 13px; color: var(--muted); background: transparent; }
  .chip[aria-pressed="true"] { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .filter-on { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: 16px; background: var(--warn-dim); color: var(--warn); font-size: 12px; max-width: 100%; }
  .filter-on span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filter-on button { min-height: 22px; padding: 0 7px; border: 0; background: transparent; color: var(--warn); }
  .status { font-size: 12px; color: var(--muted); }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
  thead th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  th[data-k] { cursor: pointer; user-select: none; } th[data-k]:hover { color: var(--text); }
  th.num, td.num { text-align: right; }
  tbody tr.person { cursor: pointer; }
  tbody tr.person:hover td { background: rgba(255, 255, 255, .02); }
  tr.person.open td { background: rgba(255, 255, 255, .03); }
  tr.linked td { color: var(--muted); }
  .who .main { font-weight: 500; overflow-wrap: anywhere; }
  .who .sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .tag { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11px; line-height: 18px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.sent { border-color: var(--accent); color: var(--accent); margin-right: 6px; }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .plan { white-space: nowrap; }
  .plan .give { margin-left: 8px; }
  .plan .lv { display: block; }
  .plan .lv + .lv { margin-top: 2px; }
  .early-day { width: 150px; }
  #view-early .opened td { color: var(--muted); }
  td.more { width: 36px; text-align: right; color: var(--muted); }
  tr.open td.more { color: var(--text); }
  .chev { display: inline-block; transition: transform 150ms; } tr.open .chev { transform: rotate(180deg); }
  tr.detail td { background: rgba(255, 255, 255, .03); border-top: 0; padding: 4px 10px 14px; }
  dl.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 18px; margin: 4px 0 0; }
  dl.facts dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  dl.facts dd { margin: 1px 0 0; overflow-wrap: anywhere; }
  .detail-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .browsers { margin: 12px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
  .browsers li { padding: 3px 0; }
  .more-row { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .empty { padding: 28px 0; text-align: center; color: var(--muted); }

  /* Error reports: the messages that come most, then each report. */
  .groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .group { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 12px; min-height: 0; background: var(--bg); white-space: normal; }
  .group[aria-pressed="true"] { border-color: var(--warn); }
  .group .times { flex: none; min-width: 42px; padding: 2px 8px; border-radius: 10px; background: var(--bad-dim); color: var(--bad); font-weight: 600; text-align: center;
    font-variant-numeric: tabular-nums; font-size: 12px; }
  .group .text { flex: 1; min-width: 0; }
  .group .text div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reports .rep td { vertical-align: top; }
  .reports .when { white-space: nowrap; }
  .reports .message { min-width: 260px; }
  .reports .message a { color: var(--text); text-decoration: none; }
  .reports .message a:hover { color: var(--accent); text-decoration: underline; }
  .reports .message a { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .reports .note { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .reports .actions { white-space: nowrap; text-align: right; }
  .linkish { background: none; border: 0; padding: 0; min-height: 0; color: inherit; text-align: left; text-decoration: underline dotted var(--line2); text-underline-offset: 3px;
    overflow-wrap: anywhere; white-space: normal; }
  .linkish:hover:not(:disabled) { background: none; color: var(--accent); }

  /* The report window: its log, Copy, the save. */
  dialog#report-dialog { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line2); border-radius: 14px;
    background: var(--panel); color: var(--text); flex-direction: column; overflow: hidden; }
  dialog#report-dialog[open] { display: flex; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .dlg-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 8px; }
  .dlg-head h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .dlg-meta { padding: 0 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .dlg-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #report-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #report-head[hidden] { display: none; }
  #report-head button { margin-left: 4px; }
  pre#report { flex: 1; margin: 0; padding: 12px 16px 16px; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace;
    background: var(--bg); min-height: 120px; }
  .copied { font-size: 12px; color: var(--accent); }

  /* The database library. */
  .lib-form { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) auto; gap: 8px; align-items: center; margin-bottom: 10px; }
  .lib-form .wide { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lib-form .wide input { flex: 1 1 260px; min-width: 0; }
  .lib-form input[type="file"] { padding: 5px 8px; min-width: 0; }
  #library td.note { white-space: normal; font-size: 12px; color: var(--muted); }
  #library img { display: block; border-radius: 4px; }
  .lib-actions { white-space: nowrap; text-align: right; }

  @media (max-width: 860px) { .charts { grid-template-columns: minmax(0, 1fr); } .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 720px) {
    .bar { padding: 10px 16px 0; } nav.tabs { padding: 4px 8px 0; } main { padding: 14px 16px 40px; }
    #at { display: none; }
    .panel { padding: 12px; border-radius: 10px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card b { font-size: 20px; }
    .lib-form { grid-template-columns: minmax(0, 1fr); }
    /* Each row of a list is a card. */
    table.stack thead { display: none; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
    table.stack tr { border-top: 1px solid var(--line); padding: 10px 0; position: relative; }
    table.stack tbody tr:first-child { border-top: 0; }
    table.stack td { border: 0; padding: 2px 0; text-align: left; }
    table.stack td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: 12px; margin-right: 8px; }
    table.stack td.num { text-align: left; }
    #people tr.person { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 10px; padding-right: 36px; }
    #people tr.person td.who, #people tr.person td.plan { grid-column: 1 / -1; }
    #people tr.person td.plan:empty { display: none; }
    #people tr.person td[data-label]::before { display: block; margin: 0; }
    #people td.more { position: absolute; right: 0; top: 10px; width: auto; }
    #people tr.detail { padding: 4px 0 12px; border-top: 0; }
    #people tr.detail td { padding: 10px; border-radius: 8px; }
    dl.facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    nav.tabs a { padding: 8px 8px 9px; }
    .long { display: none; }
    .reports .message { min-width: 0; }
    .reports .actions { text-align: left; padding-top: 6px; }
    #library tr { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 2px 12px; }
    #library td:first-child { grid-row: span 5; }
    .lib-actions { text-align: left; padding-top: 6px; }
    dialog#report-dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-tab="overview" class="gated">
<header>
  <div class="bar"><h1>CM 01/02 admin</h1><span id="at"></span><span class="spacer"></span><button id="refresh">Refresh</button></div>
  <nav class="tabs" aria-label="Parts of the admin page">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#people" data-tab="people">People<span class="count" id="n-people"></span></a>
    <a href="#members" data-tab="members">Members<span class="count" id="n-members"></span></a>
    <a href="#errors" data-tab="errors">Error<span class="long"> report</span>s<span class="count" id="n-errors"></span></a>
    <a href="#library" data-tab="library">Library<span class="count" id="n-library"></span></a>
    <a href="#early" data-tab="early">Early access<span class="count" id="n-early"></span></a>
  </nav>
</header>
<main>
  <div id="oops" role="status"></div>
  <div id="main"><p class="msg">Loading…</p></div>

  <div class="view" id="view-overview"></div>

  <div class="view" id="view-people">
    <div class="panel">
      <div class="tools">
        <input id="filter" type="search" placeholder="Search an email, a name, an id, a browser" aria-label="Search people">
        <label class="small muted">Sort <select id="sort" aria-label="Sort people by"></select></label>
        <button id="sort-dir" class="small" aria-label="Turn the order round">↓</button>
      </div>
      <div class="tools">
        <div class="chips" id="kinds"></div>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" id="linked"> Browsers that signed in</label>
      </div>
      <p class="status" id="people-status"></p>
      <table class="stack people-table"><thead><tr id="people-head"></tr></thead><tbody id="people"></tbody></table>
      <div class="more-row" id="people-more"></div>
    </div>
  </div>

  <div class="view" id="view-errors">
    <div class="panel" id="groups-panel"><h2>Messages that come most <span class="spacer"></span><span class="small muted" id="groups-note"></span></h2><div class="groups" id="groups"></div></div>
    <div class="panel">
      <div class="tools">
        <input id="err-filter" type="search" placeholder="Search a message, a note, an email" aria-label="Search error reports">
        <div class="chips" id="err-kinds"></div>
      </div>
      <div class="tools" id="err-active"></div>
      <p class="status" id="errors-status"></p>
      <table class="stack reports"><thead><tr><th>When</th><th>Who</th><th>Message</th><th>Browser</th><th></th></tr></thead><tbody id="reports"></tbody></table>
      <div class="more-row" id="errors-more"></div>
    </div>
  </div>

  <div class="view" id="view-members"><p class="msg">Loading…</p></div>
  <div class="view" id="view-early"><p class="msg">Loading…</p></div>
  <div class="view" id="view-library"><div id="library" hidden></div><p class="msg" id="library-none" hidden></p></div>
</main>

<dialog id="report-dialog" aria-labelledby="report-title">
  <div class="dlg-head"><h3 id="report-title"></h3><button id="report-x" class="small" aria-label="Close">Close</button></div>
  <div class="dlg-meta" id="report-meta"></div>
  <div class="dlg-tools">
    <button id="report-copy" class="primary">Copy report</button>
    <button id="report-copy-log">Copy log only</button>
    <button id="report-txt">Download .txt</button>
    <span class="copied" id="report-copied" aria-live="polite"></span>
  </div>
  <div id="report-head" hidden></div>
  <pre id="report"></pre>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const mb = (n) => (n >= 1073741824 ? `${(n / 1073741824).toFixed(1)} GB` : `${(n / 1048576).toFixed(n < 10485760 ? 1 : 0)} MB`);
const hours = (s) => (s >= 3600 ? `${(s / 3600).toFixed(1)} h` : `${Math.round(s / 60)} min`);
const num = (n) => Number(n ?? 0).toLocaleString();
const when = (t) => new Date(t).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const day = (t) => new Date(t).toLocaleDateString(undefined, { dateStyle: 'medium' });
const ago = (t) => {
  const m = (Date.now() - new Date(t).getTime()) / 60000;
  return m < 1 ? 'just now' : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
};
const DAY_MS = 86400000;
let data = null, library = null, coffee = null;

// ---- Tabs: the address's #part picks one, so a link or a reload opens the same part. ----
const TABS = ['overview', 'people', 'members', 'errors', 'library', 'early'];
function showTab() {
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  document.body.dataset.tab = tab;
  document.querySelectorAll('nav.tabs a').forEach((a) => (a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
}
const go = (tab) => { if (location.hash !== `#${tab}`) location.hash = tab; else showTab(); window.scrollTo({ top: 0 }); };
window.addEventListener('hashchange', showTab);
showTab();

async function load() {
  let r;
  try { r = await fetch('/api/admin/stats', { credentials: 'same-origin' }); } catch {
    if (data) { oops('Not refreshed: the server did not answer. The figures are from before.'); return; }
    gate('<p class="msg bad">The server did not answer.</p>'); return;
  }
  if (r.status === 401) { gate('<p class="msg">Sign in with Google <a href="/">on the game\'s page</a> with an admin account (CM_ADMIN_EMAILS), then come back here.</p>'); return; }
  if (r.status === 403) { gate('<p class="msg">This account is not an admin. The server\'s CM_ADMIN_EMAILS lists the admins.</p>'); return; }
  if (!r.ok) { if (data) oops(`Not refreshed: the server answered ${r.status}.`); else gate(`<p class="msg bad">The server answered ${r.status}.</p>`); return; }
  data = await r.json();
  oops('');
  $('main').innerHTML = '';
  document.body.classList.remove('gated');
  renderAll();
}
function gate(html) { document.body.classList.add('gated'); $('main').innerHTML = html; }
function oops(text) { $('oops').textContent = text; $('oops').classList.toggle('on', Boolean(text)); }

function renderAll() {
  $('at').textContent = `Updated ${new Date(data.at).toLocaleTimeString(undefined, { timeStyle: 'short' })} · every minute`;
  $('at').title = when(data.at);

  const week = data.reports.filter((r) => Date.parse(r.at) >= Date.now() - 7 * DAY_MS).length;
  $('n-errors').textContent = week || '';
  $('n-errors').className = `count${data.reports.some((r) => Date.parse(r.at) >= Date.now() - DAY_MS) ? ' alert' : ''}`;
  renderOverview();
  renderPeople();
  renderErrors();
  if (coffee) renderMembers();
}

// ---- Overview ----
let range = 30;
const METRICS = [
  { key: 'active', title: 'People active a day', of: (d) => d.active, sum: false, unit: (v) => `${num(v)} ${v === 1 ? 'person' : 'people'}`, upIs: 'good' },
  { key: 'hours', title: 'Hours played', of: (d) => d.seconds / 3600, sum: true, unit: (v) => `${v.toFixed(1)} h`, upIs: 'good' },
  { key: 'new', title: 'New people', of: (d) => d.new, sum: true, unit: (v) => `${num(v)} new`, upIs: 'good' },
  { key: 'reports', title: 'Error reports', of: (d) => d.reports, sum: true, unit: (v) => `${num(v)} ${v === 1 ? 'report' : 'reports'}`, upIs: 'bad' },
];
// Every day of the last `n`, a day with no record as 0 (the server lists only days that had something).
function lastDays(n) {
  const byDay = Object.fromEntries(data.days.map((d) => [d.day, d]));
  const end = data.days.length ? Date.parse(`${data.days[data.days.length - 1].day}T00:00:00Z`) : Date.parse(`${data.at.slice(0, 10)}T00:00:00Z`);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = new Date(end - i * DAY_MS).toISOString().slice(0, 10);
    out.push(byDay[k] ?? { day: k, active: 0, seconds: 0, sessions: 0, new: 0, reports: 0, allowed: 0, declined: 0, none: true });
  }
  return out;
}
const dayLabel = (k, long = false) => new Date(`${k}T00:00:00Z`).toLocaleDateString(undefined,
  long ? { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' } : { day: 'numeric', month: 'short', timeZone: 'UTC' });
const total = (days, m) => { const s = days.reduce((a, d) => a + m.of(d), 0); return m.sum ? s : s / (days.length || 1); };
const shown = (m, v) => (m.key === 'hours' ? `${v >= 100 ? num(Math.round(v)) : v.toFixed(1)} h` : m.sum ? num(Math.round(v)) : v < 10 ? v.toFixed(1) : num(Math.round(v)));

function chartHtml(m, i) {
  const all = lastDays(range * 2), days = all.slice(range), before = all.slice(0, range);
  const hasBefore = data.days.length && data.days[0].day <= before[0].day;   // the server keeps 90 days
  const now = total(days, m), was = total(before, m);
  let delta = '';
  if (hasBefore) {
    const ch = was ? (now - was) / was : now ? 1 : 0, pct = Math.round(Math.abs(ch) * 100);
    const dir = Math.abs(ch) < 0.005 ? 'flat' : ch > 0 ? 'up' : 'down';
    const tone = dir === 'flat' ? 'flat' : `${dir}-${(dir === 'up') === (m.upIs === 'good') ? 'good' : 'bad'}`;
    delta = dir === 'flat' ? `<span class="delta flat">same as the ${range} days before</span>`
      : `<span class="delta ${tone}">${dir === 'up' ? '▲' : '▼'} ${was ? `${pct}%` : `from 0`} on the ${range} days before</span>`;
  }
  const values = days.map((d) => m.of(d)), max = Math.max(...values), peak = days[values.indexOf(max)];
  const bars = values.map((v) => `<i style="height:${max ? Math.max(v > 0 ? 2 : 0, (v / max) * 100) : 0}%"></i>`).join('');
  const sub = m.sum ? `in ${range} days` : `on average · most ${num(max)}${peak ? `, ${dayLabel(peak.day)}` : ''}`;
  return `<div class="chart" data-m="${i}">
    <div class="title">${m.title}</div>
    <div class="value">${shown(m, now)} <span class="small muted" style="font-weight:400">${sub}</span></div>
    <div class="readout">${delta || '&nbsp;'}</div>
    <div class="plot${days.length > 45 ? ' dense' : ''}" role="img" aria-label="${esc(`${m.title}, each of the last ${range} days; most ${shown(m, max)}`)}">
      ${max ? `<div class="grid"><span>${m.key === 'hours' ? `${max.toFixed(1)} h` : num(max)}</span></div>` : ''}${bars}</div>
    <div class="axis"><span>${dayLabel(days[0].day)}</span><span>${range > 7 ? dayLabel(days[Math.floor(days.length / 2)].day) : ''}</span><span>Today</span></div>
  </div>`;
}

function attention() {
  const t = Date.now(), items = [];
  const day1 = data.reports.filter((r) => Date.parse(r.at) >= t - DAY_MS);
  const sent7 = data.reports.filter((r) => r.sent && Date.parse(r.at) >= t - 7 * DAY_MS);
  if (sent7.length) items.push({ tone: 'bad', text: `<b>${sent7.length} ${sent7.length === 1 ? 'report' : 'reports'} sent by players</b> in the last 7 days`,
    sub: sent7.map((r) => r.note || r.message).slice(0, 2).join(' · '), act: 'sent', label: 'Read them' });
  if (day1.length) items.push({ tone: 'warn', text: `<b>${day1.length} error ${day1.length === 1 ? 'report' : 'reports'}</b> in the last 24 hours`,
    sub: `the last ${ago(day1[0].at)}: ${day1[0].message}`, act: 'errors', label: 'Open' });
  const top = groups(data.reports.filter((r) => Date.parse(r.at) >= t - 7 * DAY_MS))[0];
  if (top && top.n >= 2) items.push({ tone: 'warn', text: `<b>One message came ${top.n} times</b> in 7 days, from ${top.who.size} ${top.who.size === 1 ? 'person' : 'people'}`,
    sub: top.message, act: `msg`, msg: top.message, label: 'Show' });
  const noCard = (library ?? []).filter((e) => e.card === undefined).length;
  if (noCard) items.push({ tone: 'warn', text: `<b>${noCard} ${noCard === 1 ? 'database has' : 'databases have'} no picture yet</b> in the library`, sub: 'Library, Make their pictures', act: 'library', label: 'Go' });
  if (!items.length) items.push({ tone: 'good', text: '<b>Nothing to look at.</b> No error reports in the last 24 hours, none sent by a player in 7 days.' });
  return items;
}

function renderOverview() {
  const t = data.totals;
  const answers = t.allowed30 + t.declined30;
  const card = (label, value, sub = '', href = '') => `<${href ? `a href="${href}"` : 'div'} class="card"><div class="label">${label}</div><b>${value}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</${href ? 'a' : 'div'}>`;
  $('view-overview').innerHTML = `
    <div class="panel"><h2>To look at</h2><div class="attention">${attention().map((a, i) => `<div class="item t-${a.tone}"><span class="dot"></span>
      <div class="what">${a.text}${a.sub ? `<span class="small muted">${esc(a.sub)}</span>` : ''}</div>${a.act ? `<button class="small" data-act="${i}">${a.label}</button>` : ''}</div>`).join('')}</div></div>
    <div class="cards">
      ${card('People', num(t.people), `${num(t.accounts)} with an account · ${num(t.anonymous)} anonymous`, '#people')}
      ${card('Active today', num(t.activeToday), `${num(t.active7)} in 7 days · ${num(t.active30)} in 30`)}
      ${card('Hours played', num(Math.round(t.hours)), t.people ? `${(t.hours / t.people).toFixed(1)} h a person` : '')}
      ${card('Members', num(data.accountsOn ? (data.people ?? []).filter((p) => rankOf(levelOf(p)) >= rankOf('squad')).length : t.cloud), (() => {
        const n = (l) => (data.people ?? []).filter((p) => levelOf(p) === l).length;
        const parts = [['legend', 'Club Legend', 'Club Legends'], ['squad', 'Squad Player', 'Squad Players'], ['supporter', 'Supporter', 'Supporters']]
          .map(([l, one, many]) => [n(l), one, many]).filter(([c]) => c).map(([c, one, many]) => `${num(c)} ${c === 1 ? one : many}`);
        return parts.length ? parts.join(' · ') : 'people with Membership';
      })())}
      ${card('Saves', num(t.saves), `${mb(t.savesBytes)} · ${num(t.older)} older copies (${mb(t.olderBytes)})`)}
      ${card('Data sets', num(t.sets), mb(t.setsBytes))}
      ${card('Error reports', `<span class="${t.reports7 ? 'bad' : ''}">${num(t.reports7)}</span>`, 'in 7 days', '#errors')}
      ${card('Said yes to statistics', answers ? `${Math.round(100 * t.allowed30 / answers)}%` : '–', `${num(t.allowed30)} yes · ${num(t.declined30)} no, in 30 days`)}
    </div>
    <div class="panel"><h2>Languages</h2>${(data.languages ?? []).length ? `<p class="small" style="margin:0">${(data.languages ?? []).map((l) =>
      `<b>${esc(l.lang === '?' ? 'not told' : l.lang)}</b> ${num(l.people)}`).join(' · ')}</p>
      <p class="small muted" style="margin:8px 0 0">People of the last 30 days by their browser's language (pt-BR and pt-PT count as pt); only those who allowed statistics.</p>`
      : '<p class="small muted" style="margin:0">No browser languages yet: the page sends them from its next version.</p>'}</div>
    <div class="panel"><h2>Days <span class="spacer"></span><span class="seg" role="group" aria-label="How many days">${[7, 30, 90].map((n) =>
      `<button data-range="${n}" aria-pressed="${range === n}">${n} days</button>`).join('')}</span></h2>
      <div class="charts">${METRICS.map(chartHtml).join('')}</div>
      <p class="small muted" style="margin:10px 0 0">Point at a bar for its day. Days run in UTC; today is still counting.</p></div>`;
  const items = attention();
  $('view-overview').querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = () => {
      const a = items[Number(b.dataset.act)];
      if (a.act === 'library') { go('library'); return; }
      errState = { ...errState, kind: a.act === 'sent' ? 'sent' : 'all', msg: a.act === 'msg' ? a.msg : null, who: null, shown: 25 };
      renderErrors();
      go('errors');
    };
  });
  $('view-overview').querySelectorAll('[data-range]').forEach((b) => { b.onclick = () => { range = Number(b.dataset.range); renderOverview(); }; });
  // The hover readout: the day under the pointer (a finger too) and its value.
  $('view-overview').querySelectorAll('.chart').forEach((c) => {
    const m = METRICS[Number(c.dataset.m)], days = lastDays(range), plot = c.querySelector('.plot'), out = c.querySelector('.readout'), rest = out.innerHTML;
    const bars = plot.querySelectorAll('i');
    const at = (e) => {
      const r = plot.getBoundingClientRect(), i = Math.min(days.length - 1, Math.max(0, Math.floor(((e.clientX - r.left) / r.width) * days.length)));
      plot.classList.add('hovering');
      bars.forEach((b, j) => b.classList.toggle('on', j === i));
      const d = days[i];
      out.classList.add('live');
      out.textContent = `${dayLabel(d.day, true)}: ${m.unit(m.of(d))}${m.key === 'active' ? ` · ${hours(d.seconds)} · ${num(d.new)} new` : ''}`;
    };
    plot.onpointermove = at;
    plot.onpointerdown = at;
    plot.onpointerleave = () => { plot.classList.remove('hovering'); bars.forEach((b) => b.classList.remove('on')); out.classList.remove('live'); out.innerHTML = rest; };
  });
}

// ---- People ----
const SORTS = [['last', 'Last seen'], ['first', 'First seen'], ['seconds', 'Played'], ['sessions', 'Visits'], ['days', 'Days played'], ['saves', 'Saves'],
  ['sets', 'Data sets'], ['reports', 'Errors'], ['plan', 'Membership'], ['who', 'Name']];
const COLS = [['who', 'Who'], ['plan', 'Membership'], ['last', 'Last seen'], ['seconds', 'Played', 'num'], ['saves', 'Saves', 'num'], ['reports', 'Errors', 'num']];
// The levels of an account (levels.mjs), lowest first.
const LEVELS = ['free', 'supporter', 'squad', 'legend'];
const LEVEL_NAME = { free: 'Free', supporter: 'Supporter', squad: 'Squad Player', legend: 'Club Legend' };
const rankOf = (level) => Math.max(0, LEVELS.indexOf(level));
const levelOf = (p) => (p.kind === 'account' ? p.plan?.level ?? (p.cloud ? 'squad' : 'free') : null);
const KINDS = [['all', 'All', () => true], ['account', 'Accounts', (p) => p.kind === 'account'], ['anon', 'Anonymous', (p) => p.kind !== 'account'],
  ...LEVELS.map((l) => [l, LEVEL_NAME[l], (p) => levelOf(p) === l]),
  ['errors', 'With errors', (p) => p.reports > 0], ['week', 'Seen in 7 days', (p) => p.last >= Date.now() - 7 * DAY_MS]];
const PAGE = 50;
let sortKey = 'last', sortDir = -1, filter = '', kind = 'all', showLinked = false, peopleShown = PAGE;
const expanded = new Set();
const keyOf = (p, k) => (k === 'who' ? (p.email || p.id).toLowerCase() : k === 'saves' || k === 'older' || k === 'sets' ? p[k]?.n ?? 0
  : k === 'plan' ? (p.kind === 'account' ? 1 + 2 * rankOf(levelOf(p)) + (p.plan?.paidLevel ? 1 : 0) : 0) : p[k] ?? '');

$('sort').innerHTML = SORTS.map(([k, label]) => `<option value="${k}">${label}</option>`).join('');
$('filter').oninput = (e) => { filter = e.target.value; peopleShown = PAGE; renderPeople(); };
$('sort').onchange = (e) => { sortKey = e.target.value; sortDir = sortKey === 'who' ? 1 : -1; renderPeople(); };
$('sort-dir').onclick = () => { sortDir = -sortDir; renderPeople(); };
$('linked').onchange = (e) => { showLinked = e.target.checked; peopleShown = PAGE; renderPeople(); };
$('kinds').onclick = (e) => { const b = e.target.closest('[data-kind]'); if (b) { kind = b.dataset.kind; peopleShown = PAGE; renderPeople(); } };
$('people-head').onclick = (e) => {
  const th = e.target.closest('th[data-k]');
  if (!th) return;
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : k === 'who' ? 1 : -1;
  sortKey = k;
  renderPeople();
};
$('people-more').onclick = (e) => { const b = e.target.closest('[data-more]'); if (b) { peopleShown = b.dataset.more === 'all' ? Infinity : peopleShown + PAGE; renderPeople(); } };
$('people').onclick = (e) => {
  const give_ = e.target.closest('[data-give]');
  if (give_) { e.stopPropagation(); give(give_.dataset.give, give_.dataset.giveLevel); return; }
  const back = e.target.closest('[data-take-back]');
  if (back) { e.stopPropagation(); give(back.dataset.takeBack, null); return; }
  const errs = e.target.closest('[data-their-errors]');
  if (errs) { showErrorsOf(errs.dataset.theirErrors); return; }
  const cp = e.target.closest('[data-copy-id]');
  if (cp) { copy(cp.dataset.copyId, cp); return; }
  if (e.target.closest('tr.detail, a, button:not([data-toggle])')) return;
  const tr = e.target.closest('tr.person');
  if (!tr || getSelection().toString()) return;
  const id = tr.dataset.id;
  expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  renderPeople();
};

// The account's level (the server reads each account record; cloud.mjs planOfSub): where it comes from (paid, a gift,
// an admin, the server's list), and the buttons that give Squad Player or Club Legend, or take a gift back.
function planCell(p) {
  if (p.kind !== 'account') return '';
  const pl = p.plan;
  if (!data.accountsOn) return '<span class="muted small">no accounts</span>';
  if (!pl) return '<span class="muted small">no record</span>';
  const tone = (l) => (rankOf(l) >= rankOf('squad') ? 'good' : 'muted');
  const lines = [];
  if (pl.paidLevel) lines.push([pl.paidLevel, `${LEVEL_NAME[pl.paidLevel]} · paid${pl.cancelAt ? ` · ends ${esc(day(pl.cancelAt))}` : pl.until ? ` · to ${esc(day(pl.until))}` : ''}${pl.known === false ? ` <span class="warn small">(${esc(pl.bmcLevel ?? 'its level')}: not in CM_LEVELS)</span>` : ''}`]);
  if (pl.givenLevel) lines.push([pl.givenLevel, `${LEVEL_NAME[pl.givenLevel]} · gift${pl.givenAt ? ` · ${esc(day(pl.givenAt))}` : ''}`]);
  if (pl.admin) lines.push(['legend', 'Club Legend · admin']);
  if (!lines.length) lines.push([pl.level, pl.cloud ? `${LEVEL_NAME[pl.level]} · server list` : LEVEL_NAME[pl.level] ?? 'Free']);
  lines.sort((x, y) => rankOf(y[0]) - rankOf(x[0]));
  const buttons = [pl.givenLevel ? `<button class="give small" data-take-back="${esc(p.id)}">Take back</button>` : '',
    ...['squad', 'legend'].filter((l) => rankOf(l) > rankOf(pl.level)).map((l) =>
      `<button class="give small primary" data-give="${esc(p.id)}" data-give-level="${l}">Give ${LEVEL_NAME[l]}</button>`)].join('');
  return `${lines.map(([l, text]) => `<span class="lv ${tone(l)}">${text}</span>`).join('')}${buttons}`;
}

async function give(id, level) {
  const p = data.people.find((x) => x.id === id);
  if (!confirm(`${level ? `Give ${LEVEL_NAME[level]} to` : 'Take back the gift of'} ${p?.email ?? id}? It counts from the player's next page load.`)) return;
  const r = await fetch('/api/admin/cloud', { method: 'POST', credentials: 'same-origin',
    headers: { 'content-type': 'application/json', 'x-cm': '1' }, body: JSON.stringify({ id, level }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(`Not changed: ${j.error ?? `the server answered ${r.status}`}`); return; }
  if (p) { p.plan = j.plan; p.cloud = j.plan.cloud; }
  renderPeople();
}

function whoHtml(p, byId, browsersOf) {
  if (p.kind === 'account') {
    const n = browsersOf[p.id]?.length ?? 0;
    return `<div class="main">${esc(p.email)}</div><div class="sub">${esc(p.name)}${n ? `${p.name ? ' · ' : ''}${n} ${n === 1 ? 'browser' : 'browsers'}` : ''}</div>`;
  }
  return `<div class="main">Anonymous <code>${esc(p.id.slice(2, 10))}</code></div>${p.account ? `<div class="sub">signed in as ${esc(byId[p.account]?.email ?? 'an account')}</div>`
    : `<div class="sub">${esc(p.browser)}</div>`}`;
}

function detailHtml(p, browsersOf) {
  const mine = browsersOf[p.id] ?? [];
  const sized = (x) => `${num(x?.n ?? 0)} · ${mb(x?.bytes ?? 0)}`;
  const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const reports = p.reports + mine.reduce((a, b) => a + (b.reports ?? 0), 0);
  return `<tr class="detail"><td colspan="${COLS.length + 1}"><dl class="facts">
    ${fact('First seen', esc(when(p.first)))}${fact('Last seen', esc(when(p.last)))}${fact('Played', `${hours(p.seconds)} in ${num(p.sessions)} visits, ${num(p.days)} days`)}
    ${fact('Saves', sized(p.saves))}${fact('Older copies', sized(p.older))}${fact('Data sets', sized(p.sets))}
    ${fact('Browser', esc(p.browser) || '–')}${fact('Engine', `<span class="small">${esc(p.engine) || '–'}</span>`)}
    ${fact('Vault', p.vault ? 'on' : '<span class="warn">off in the last visit</span>')}${fact('Id', `<code>${esc(p.id)}</code>`)}
  </dl>${mine.length ? `<ul class="browsers">${mine.map((b) => `<li>Browser <code>${esc(b.id.slice(2, 10))}</code> · ${esc(b.browser)} · seen ${esc(ago(b.last))} · ${hours(b.seconds)} before it signed in</li>`).join('')}</ul>` : ''}
  <div class="detail-tools">${reports ? `<button class="small" data-their-errors="${esc(p.id)}">Their error reports (${reports})</button>` : ''}
    <button class="small" data-copy-id="${esc(p.email || p.id)}">Copy ${p.email ? 'email' : 'id'}</button></div></td></tr>`;
}

function renderPeople() {
  if (!data) return;
  const byId = Object.fromEntries(data.people.map((p) => [p.id, p]));
  const browsersOf = {};
  for (const p of data.people) if (p.account) (browsersOf[p.account] ??= []).push(p);
  const base = data.people.filter((p) => showLinked || !p.account);
  const f = filter.trim().toLowerCase();
  const found = base.filter((p) => !f || `${p.email ?? ''} ${p.name ?? ''} ${p.id} ${p.browser ?? ''}`.toLowerCase().includes(f));
  $('kinds').innerHTML = KINDS.map(([k, label, test]) => `<button class="chip" data-kind="${k}" aria-pressed="${kind === k}">${label}<span class="n">${num(found.filter(test).length)}</span></button>`).join('');
  const list = found.filter(KINDS.find(([k]) => k === kind)[2]);
  list.sort((a, b) => { const x = keyOf(a, sortKey), y = keyOf(b, sortKey); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  $('sort').value = sortKey;
  $('sort-dir').textContent = sortDir < 0 ? '↓' : '↑';
  $('people-head').innerHTML = COLS.map(([k, label, cls]) => `<th data-k="${k}" class="${cls ?? ''}" aria-sort="${sortKey === k ? (sortDir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${sortKey === k ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('') + '<th></th>';
  const page = list.slice(0, peopleShown);
  $('people-status').textContent = list.length ? `${page.length < list.length ? `${num(page.length)} of ` : ''}${num(list.length)} ${list.length === 1 ? 'person' : 'people'}${showLinked ? '' : '. A browser that signed in counts with its account.'}` : '';
  $('people').innerHTML = page.length ? page.map((p) => {
    const open = expanded.has(p.id);
    return `<tr class="person${p.account ? ' linked' : ''}${open ? ' open' : ''}" data-id="${esc(p.id)}">
      <td class="who">${whoHtml(p, byId, browsersOf)}</td>
      <td class="plan">${planCell(p)}</td>
      <td data-label="Last seen" title="${esc(when(p.last))}">${esc(ago(p.last))}</td>
      <td class="num" data-label="Played">${hours(p.seconds)}</td>
      <td class="num" data-label="Saves">${num(p.saves?.n ?? 0)}</td>
      <td class="num" data-label="Errors">${p.reports ? `<span class="bad">${p.reports}</span>` : '0'}</td>

// The whole report (its log), from the store, kept for a second open or copy.
const reportCache = new Map();
function fullReport(r) {
  if (!reportCache.has(r.key)) {
    reportCache.set(r.key, fetch(`/api/admin/report?key=${encodeURIComponent(r.key)}`, { credentials: 'same-origin' })
      .then((res) => (res.ok ? res.json() : null)).catch(() => null).then((f) => { if (!f) reportCache.delete(r.key); return f; }));
  }
  return reportCache.get(r.key);
}
const reportText = (full) => `${full.at} · ${full.id}${emailOf(full.id) ? ` (${emailOf(full.id)})` : ''} · ${full.browser} · ${full.engine}${full.where ? ` · ${full.where}` : ''}\n${full.message}${
  full.note ? `\n\nThe player wrote:\n${full.note}` : ''}\n\n${(full.log ?? []).join('\n')}`;

// Copy to the clipboard. A text that is still coming (a report from the store) goes as a promise, so Safari keeps the click.
async function copy(text, button) {
  const say = (t) => {
    const out = button.id === 'report-copy' || button.id === 'report-copy-log' ? $('report-copied') : null;
    if (out) { out.textContent = t; clearTimeout(out.timer); out.timer = setTimeout(() => { out.textContent = ''; }, 2000); return; }
    const was = button.dataset.label ?? button.textContent;
    button.dataset.label = was;
    button.textContent = t;
    clearTimeout(button.timer);
    button.timer = setTimeout(() => { button.textContent = was; delete button.dataset.label; }, 1500);
  };
  try {
    if (typeof text !== 'string' && window.ClipboardItem && navigator.clipboard?.write) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'text/plain': Promise.resolve(text).then((t) => new Blob([t], { type: 'text/plain' })) })]);
        say('Copied');
        return;
      } catch (err) { if (err?.message === 'not in the store') throw err; }
    }
    const t = await text;
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(t);
    else {
      const area = Object.assign(document.createElement('textarea'), { value: t });
      area.style.cssText = 'position:fixed;opacity:0';
      (button.closest('dialog') ?? document.body).append(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      if (!ok) throw new Error('refused');
    }
    say('Copied');
  } catch (err) {
    say(err?.message === 'not in the store' ? 'Not in the store' : 'Not copied');
  }
}

let openFull = null;
async function openReport(r) {
  const dlg = $('report-dialog'), box = $('report'), head = $('report-head');
  $('report-title').textContent = r.message;
  $('report-meta').innerHTML = [esc(when(r.at)), esc(whoOf(r.id)), esc(r.browser), `<span>${esc(r.engine)}</span>`, r.sent ? '<span class="good">sent by the player</span>' : ''].filter(Boolean).map((x) => `<span>${x}</span>`).join('');
  head.hidden = true;

  const full = await fullReport(r);
  if (!dlg.open) return;
  openFull = full;
  box.textContent = full ? reportText(full) : 'The report file is not in the store.';
  ['report-copy', 'report-copy-log', 'report-txt'].forEach((id) => { $(id).disabled = !full; });
  if (full?.where) $('report-meta').insertAdjacentHTML('beforeend', `<span>${esc(full.where)}</span>`);
  // A save the player sent: kept packed (gzip) in the store; the button unpacks it and saves it under its own name.
  if (full?.save) {
    head.hidden = false;
    head.innerHTML = full.saveUrl
      ? `Save: <b>${esc(full.save.name)}</b> (${mb(full.save.rawSize ?? full.save.size)}, ${mb(full.save.size)} packed)<button id="report-save-get" class="small primary">Download the save</button> <a href="${esc(full.saveUrl)}" class="small">packed (.gz)</a>`
      : `Save: ${esc(full.save.name)}: ${full.save.done ? 'the store gives no link' : 'it did not arrive'}`;
    const get = $('report-save-get');
    if (get) get.onclick = async () => {
      get.disabled = true;
      get.textContent = 'Getting it…';
      try {
        const got = await fetch(full.saveUrl);
        if (!got.ok) throw new Error(`the store answered ${got.status}`);
        const blob = await new Response(got.body.pipeThrough(new DecompressionStream('gzip'))).blob();

      } catch (err) {
        // The bucket's CORS rules do not let this page read it (a page cannot tell why a fetch failed): the
        // packed link opens as a plain download, which needs no CORS.
        get.textContent = 'Not got here: use the packed (.gz) link';
      }
      get.disabled = false;
    };
  }
}

// An upload with its progress (fetch tells none for an upload).
function put(url, body, headers, onPart, same) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.withCredentials = same;
    for (const [k, v] of Object.entries(headers ?? {})) x.setRequestHeader(k, v);
    x.upload.onprogress = (e) => { if (e.lengthComputable) onPart(e.loaded / e.total); };
    x.onload = () => (x.status >= 200 && x.status < 300 ? ok() : bad(new Error(`HTTP ${x.status}`)));
    x.onerror = () => bad(new Error('the upload did not go'));
    x.send(body);
  });
}

    : '<span class="warn">None yet.</span> Buy Me a Coffee has sent nothing here: in Buy Me a Coffee, Integrations, Webhooks, the address is this site + /api/coffee/webhook with the membership events, and Send test event shows here.';
  $('view-members').innerHTML = `<div class="panel"><h2>Last notification from Buy Me a Coffee</h2><p class="small" style="margin:0">${last}</p>
    <p class="small muted" style="margin:8px 0 0">${c.levels?.names ? `Buy Me a Coffee levels, lowest first (CM_LEVELS): ${c.levels.names.map((n, i) => `${esc(n)} = ${['Supporter', 'Squad Player', 'Club Legend'][Math.min(i, 2)]}`).join(', ')}. Squad Player and up have Membership; Club Legends early access too.`
      : `Levels that give Membership: ${c.levels?.legacyCloud?.length ? c.levels.legacyCloud.map(esc).join(', ') : 'every level'} (BMC_CLOUD_LEVELS; CM_LEVELS replaces it and names Club Legend).`}
      A member gets it once they sign in here with Google using the same email as on Buy Me a Coffee. A one-off coffee is not a membership and is not listed.</p></div>
    <div class="panel"><h2>Memberships <span class="count">${c.members.length}</span></h2>
    ${c.members.length ? `<table class="stack"><thead><tr><th>Email</th><th>Level</th><th>Counts as</th><th>Status</th><th>Membership</th><th>Signed in here</th><th>Last change</th></tr></thead><tbody>
      ${c.members.map((m) => { const p = seen.get(String(m.email).toLowerCase());
        return `<tr><td><b style="font-weight:500">${esc(m.email)}</b></td><td data-label="Level">${esc(m.level ?? '–')}</td><td data-label="Counts as">${siteLevel(m)}</td><td data-label="Status">${esc(m.status ?? '–')}</td>
        <td data-label="Membership">${state(m)}</td><td data-label="Signed in here">${p ? `yes · ${esc(ago(p.last))}` : '<span class="muted" title="Not in People: not signed in yet, another Google email, or the statistics are off for them">not seen</span>'}</td>
        <td class="small muted" data-label="Last change">${esc(m.event ?? '')} · ${esc(day(m.at))}</td></tr>`; }).join('')}
    </tbody></table>` : '<p class="empty">No membership yet.</p>'}</div>`;
}

// ---- Early access (early.mjs): each feature of features.js and each library database with a day, before which only
// Club Legends have it. A day opens at 00:00 UTC; Open now writes today (a feature) or clears it (a database). ----
const todayUTC = () => new Date().toISOString().slice(0, 10);
const addDaysUTC = (d, n) => new Date(Date.parse(`${d}T00:00:00Z`) + n * 86400e3).toISOString().slice(0, 10);
let earlyData = null;
async function loadEarly() {
  const r = await fetch('/api/admin/early', { credentials: 'same-origin' }).catch(() => null);
  earlyData = r?.ok ? await r.json() : { features: [], today: todayUTC(), none: r?.status === 404 };
  renderEarly();
}
function renderEarly() {
  if (!earlyData) return;
  const today = earlyData.today ?? todayUTC();
  const rows = [...earlyData.features.map((f) => ({ id: `f:${f.key}`, kind: 'Feature', name: f.name, day: f.day })),
    ...(library ?? []).filter((e) => e.early).map((e) => ({ id: `db:${e.id}`, kind: 'Database', name: e.name, day: e.early }))];
  const still = rows.filter((x) => x.day && x.day > today), opened = rows.filter((x) => !(x.day && x.day > today));
  $('n-early').textContent = still.length || '';
  const row = (x, open) => `<tr data-early-row="${esc(x.id)}"${open ? ' class="opened"' : ''}><td><b style="font-weight:500">${esc(x.name)}</b></td><td data-label="Kind">${x.kind}</td>
    <td data-label="${open ? 'Opened' : 'Club Legends only until'}">${open ? esc(x.day ?? '–') : `<input type="date" class="early-day" value="${esc(x.day)}" min="${esc(addDaysUTC(today, 1))}"> <button class="small" data-save-day>Save</button>`}</td>
    <td>${open ? '' : '<button class="small primary" data-open-now>Open now</button>'}</td></tr>`;
  const table = (list, open) => `<table class="stack"${open ? ' data-open-list' : ''}><thead><tr><th>Name</th><th>Kind</th><th>${open ? 'Opened' : 'Club Legends only until'}</th><th></th></tr></thead><tbody>${list.map((x) => row(x, open)).join('')}</tbody></table>`;
  $('view-early').innerHTML = `<div class="panel"><h2>In early access <span class="count">${still.length}</span></h2>
    <p class="small muted" style="margin:0 0 10px">Club Legends have these now; everyone else sees them with the day they open (00:00 UTC). A new feature
      (web/features.js) gets 14 days by itself; a new database gets the day set in the library form.${earlyData.none ? ' <span class="warn">Early access needs the bucket.</span>' : ''}</p>
    ${still.length ? table(still, false) : '<p class="empty">Nothing in early access now.</p>'}</div>
    ${opened.length ? `<div class="panel"><h2>Open to everyone</h2>${table(opened, true)}</div>` : ''}`;
  const setDay = async (id, value) => {
    const [kind, key] = [id.slice(0, id.indexOf(':')), id.slice(id.indexOf(':') + 1)];
    const r = kind === 'f'
      ? await fetch('/api/admin/early', { method: 'PUT', credentials: 'same-origin', headers: CHANGE, body: JSON.stringify({ key, day: value }) })
      : await fetch(`/api/admin/library/${key}`, { method: 'PATCH', credentials: 'same-origin', headers: CHANGE, body: JSON.stringify({ early: value ?? todayUTC() }) });
    if (!r.ok) { alert(`Not changed: ${(await r.json().catch(() => ({}))).error ?? `HTTP ${r.status}`}`); return; }
    if (kind === 'db') await loadLibrary();
    await loadEarly();
  };
  $('view-early').querySelectorAll('[data-early-row]').forEach((tr) => {
    const id = tr.dataset.earlyRow;
    const save = tr.querySelector('[data-save-day]'), now = tr.querySelector('[data-open-now]');
    if (save) save.onclick = () => { const v = tr.querySelector('input').value; if (v) setDay(id, v); };
    if (now) now.onclick = () => { if (confirm(`Open ${tr.querySelector('b').textContent} to everyone now?`)) setDay(id, null); };
  });
}

$('refresh').onclick = () => { load(); loadLibrary().then(loadEarly); loadMembers(); };
load();
loadLibrary().then(loadEarly);
loadMembers();
setInterval(() => { load(); loadMembers(); }, 60000);
</script>
